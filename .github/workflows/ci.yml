name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: reportdb
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: appuser
          RABBITMQ_DEFAULT_PASS: apppass
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppass
          MYSQL_DB: reportdb
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CELERY_BROKER: amqp://appuser:apppass@127.0.0.1:5672//
          CELERY_BACKEND: redis://127.0.0.1:6379/1
          JWT_SECRET_KEY: test-secret-key-at-least-32-bytes-long-000
          AES_KEY: "0123456789abcdef0123456789abcdef"
          AES_IV: "abcdef9876543210"
          REPORT_DIR: /tmp/reports
        run: |
          pytest -v